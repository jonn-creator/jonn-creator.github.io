<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SharpMind Guides - Brain & Hearing Health</title>
<style>
  body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; background: #f6f8fa; color: #333; }
  header { background: #4CAF50; color: #fff; padding: 40px 20px; text-align: center; }
  header h1 { margin: 0; font-size: 2em; }
  header p { font-size: 1.2em; margin-top: 10px; }
  .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
  .form-container { background: #fff; padding: 20px 30px; margin-bottom: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h2 { margin-top: 0; color: #333; }
  input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; }
  button { padding: 12px 20px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; transition: background 0.3s ease; }
  button:hover { background: #45a049; }
  .msgOdoo { margin-top: 10px; font-size: 0.9em; color: green; }
  @media(max-width:600px){ header h1 { font-size: 1.5em; } header p { font-size: 1em; } .form-container { padding: 15px 20px; } }

  /* Popup Styles */
  #popupForm {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    max-width: 90%;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    padding: 20px;
    display: none;
    z-index: 9999;
  }
  #popupForm h3 { margin-top: 0; font-size: 1.2em; }
  #popupForm button { width: 100%; }
  #popupClose { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 1.2em; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>SharpMind Guides</h1>
  <p>Get Your Free Brain & Hearing Health Guide</p>
</header>

<div class="container">
  <!-- Main Landing Form -->
  <div class="form-container">
    <h2>Get Your Free Guide</h2>
    <form class="optInOdoo" data-form-name="Main Landing Form">
      <input type="email" name="email" placeholder="Your email" required />
      <input type="text" name="name" placeholder="First name (optional)" />
      <button type="submit">Get My Free Guide</button>
      <div class="msgOdoo"></div>
    </form>
  </div>

  <!-- Blog Post Forms (5 forms) -->
  <div class="form-container"><h2>Blog Post 1 Signup</h2><form class="optInOdoo" data-form-name="Blog Post 1"><input type="email" name="email" placeholder="Your email" required /><input type="text" name="name" placeholder="First name (optional)" /><button type="submit">Sign Up</button><div class="msgOdoo"></div></form></div>

  <div class="form-container"><h2>Blog Post 2 Signup</h2><form class="optInOdoo" data-form-name="Blog Post 2"><input type="email" name="email" placeholder="Your email" required /><input type="text" name="name" placeholder="First name (optional)" /><button type="submit">Sign Up</button><div class="msgOdoo"></div></form></div>

  <div class="form-container"><h2>Blog Post 3 Signup</h2><form class="optInOdoo" data-form-name="Blog Post 3"><input type="email" name="email" placeholder="Your email" required /><input type="text" name="name" placeholder="First name (optional)" /><button type="submit">Sign Up</button><div class="msgOdoo"></div></form></div>

  <div class="form-container"><h2>Blog Post 4 Signup</h2><form class="optInOdoo" data-form-name="Blog Post 4"><input type="email" name="email" placeholder="Your email" required /><input type="text" name="name" placeholder="First name (optional)" /><button type="submit">Sign Up</button><div class="msgOdoo"></div></form></div>

  <div class="form-container"><h2>Blog Post 5 Signup</h2><form class="optInOdoo" data-form-name="Blog Post 5"><input type="email" name="email" placeholder="Your email" required /><input type="text" name="name" placeholder="First name (optional)" /><button type="submit">Sign Up</button><div class="msgOdoo"></div></form></div>

</div>

<!-- Popup Form -->
<div id="popupForm">
  <button id="popupClose">&times;</button>
  <h3>Wait! Don’t Miss Your Free Guide!</h3>
  <form class="optInOdoo" data-form-name="Popup Form">
    <input type="email" name="email" placeholder="Your email" required />
    <input type="text" name="name" placeholder="First name (optional)" />
    <button type="submit">Sign Up Now</button>
    <div class="msgOdoo"></div>
  </form>
</div>

<script>
const AFFILIATE_URL = 'https://6c63eby7so29wk6y11m6vk-m6h.hop.clickbank.net';
const ODOO_URL = 'https://sharpmindguidescom.odoo.com';
const API_KEY = '74a3b8f5ea170a909ee67094d08c33864bea0e6c';
const LIST_ID = '2';

// Function to handle all forms with conversion tracking
function setupOdooForm(form){
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const email = form.email.value.trim();
    const name = form.name.value.trim();
    const msgDiv = form.querySelector('.msgOdoo');
    const formName = form.dataset.formName;

    // Submit to Odoo
    fetch(`${ODOO_URL}/api/email_marketing_subscribe`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({ email: email, name: name, list_id: LIST_ID })
    }).then(res => {
      if(res.ok){
        msgDiv.textContent = 'Thanks! Redirecting you now...';

        // Conversion Tracking
        console.log(`Conversion from form: ${formName}, Email: ${email}`);

        // Redirect
        setTimeout(()=>{ window.location.href = AFFILIATE_URL }, 900);
      } else {
        msgDiv.textContent = 'Error submitting email. Try again.';
      }
    }).catch(err => {
      msgDiv.textContent = 'Error submitting email. Try again.';
    });
  });
}

// Apply to all forms
document.querySelectorAll('.optInOdoo').forEach(form => setupOdooForm(form));

// Popup logic
const popup = document.getElementById('popupForm');
const popupClose = document.getElementById('popupClose');

// Show popup after 5 seconds
setTimeout(()=>{ popup.style.display = 'block'; }, 5000);

// Exit-intent trigger
document.addEventListener('mouseout', function(e){
  if(!popup.dataset.shown && e.clientY < 5){
    popup.style.display = 'block';
    popup.dataset.shown = true;
  }
});

// Close popup
popupClose.addEventListener('click', ()=>{ popup.style.display = 'none'; });
</script>

</body>
</html>
