<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SharpMind Guides - Boost Your Brain & Hearing Health</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Base */
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: #f4f6f8; color: #333; scroll-behavior: smooth; overflow-x:hidden; }
  a { text-decoration: none; color: inherit; }
  h1,h2,h3 { margin: 0; }
  p { margin: 0 0 1em; }
  img { max-width: 100%; display:block; }

  /* Hero Header with Illustration */
  header { background: linear-gradient(135deg,#4CAF50,#45a049); color:#fff; text-align:center; padding:100px 20px 100px; position: relative; overflow:hidden; }
  header::before { content:''; position:absolute; width:100%; height:100%; top:0; left:0; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05) 0%, transparent 60%), radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05) 0%, transparent 60%); pointer-events:none; }
  header h1 { font-size:2.8em; line-height:1.2; opacity:0; transform:translateY(30px); animation:fadeUp 1s forwards 0.3s; }
  header p { font-size:1.2em; margin-top:20px; opacity:0; transform:translateY(30px); animation:fadeUp 1s forwards 0.6s; }
  .hero-cta { margin-top:40px; opacity:0; transform:translateY(30px); animation:fadeUp 1s forwards 0.9s; position:relative; display:inline-block; }
  .hero-cta button { padding:16px 35px; font-size:1.1em; border-radius:10px; border:none; background:#fff; color:#4CAF50; font-weight:600; cursor:pointer; transition:all 0.3s ease; position:relative; overflow:hidden; }
  .hero-cta button:hover { background:#e6f5ea; }
  .hero-cta button::after { content:'↓'; position:absolute; right:15px; top:50%; transform:translateY(-50%) translateX(0); transition: transform 0.3s; font-size:1.2em; }
  .hero-cta button:hover::after { transform:translateY(-50%) translateX(5px); }

  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  /* Container */
  .container { max-width:1100px; margin:0 auto; padding:60px 20px; }

  /* Sections */
  .section { margin-bottom:80px; }
  .section h2 { color:#4CAF50; margin-bottom:40px; text-align:center; font-size:2em; opacity:0; transform:translateY(20px); animation:fadeUp 1s forwards; }

  /* Forms */
  .form-container { background:#fff; padding:35px 45px; margin-bottom:50px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s; opacity:0; transform:translateY(30px); }
  .form-container.visible { opacity:1; transform:translateY(0); }
  .form-container:hover { transform: translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,0.15); }
  input { width:100%; padding:15px 18px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:1em; transition:border 0.3s; }
  input:focus { border-color:#4CAF50; outline:none; }
  button { padding:15px 22px; background:#4CAF50; color:#fff; border:none; border-radius:8px; font-size:1em; cursor:pointer; transition: all 0.3s; width:100%; }
  button:hover { background:#45a049; }
  .msgOdoo { margin-top:12px; font-size:0.9em; color:green; }

  /* Features */
  .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:35px; }
  .feature { background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.08); text-align:center; transition: transform 0.3s, box-shadow 0.3s; opacity:0; transform:translateY(30px); }
  .feature img { height:65px; margin-bottom:20px; }
  .feature h3 { color:#4CAF50; margin-bottom:12px; }
  .feature p { color:#555; font-size:0.95em; }
  .feature.visible { opacity:1; transform:translateY(0); }
  .feature:hover { transform: translateY(-5px); box-shadow:0 10px 20px rgba(0,0,0,0.12); }

  /* Testimonials */
  .testimonials { background:#e6f5ea; padding:60px 20px; border-radius:12px; }
  .testimonial { text-align:center; max-width:500px; margin:0 auto 40px; opacity:0; transform:translateY(30px); transition: all 0.6s ease; }
  .testimonial.visible { opacity:1; transform:translateY(0); }
  .testimonial p { font-style:italic; color:#333; font-size:1em; }
  .testimonial h4 { color:#4CAF50; margin-top:12px; font-weight:600; }

  /* Popup */
  #popupForm { position:fixed; bottom:20px; right:20px; width:340px; max-width:90%; background:#fff; border-radius:12px; box-shadow:0 6px 25px rgba(0,0,0,0.25); padding:30px; display:none; z-index:9999; animation:popupEnter 0.5s ease; }
  #popupForm h3 { margin-top:0; font-size:1.25em; color:#4CAF50; }
  #popupForm button { width:100%; }
  #popupClose { position:absolute; top:12px; right:15px; background:none; border:none; font-size:1.3em; cursor:pointer; color:#888; }
  @keyframes popupEnter { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

  /* Footer */
  footer { background:#333; color:#fff; padding:50px 20px; text-align:center; }
  footer p { margin-bottom:10px; font-size:0.9em; }
  footer a { color:#4CAF50; }

  @media(max-width:768px){ header h1{font-size:2.2em;} header p{font-size:1em;} .features{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header>
  <h1>Unlock Your Brain & Hearing Potential</h1>
  <p>Download our free guide to improve mental clarity and hearing health today.</p>
  <div class="hero-cta">
    <button onclick="scrollToSection('mainForm')">Get My Free Guide</button>
  </div>
  <!-- Hero Illustration -->
  <img src="https://img.icons8.com/external-flaticons-lineal-color-flat-icons/200/ffffff/external-brain-health-flaticons-lineal-color-flat-icons.png" alt="Brain Illustration" style="position:absolute; bottom:-10px; right:10px; width:200px; opacity:0.2;">
</header>

<div class="container">

  <!-- Features Section -->
  <div class="section features" id="features"></div>

  <!-- Forms Section -->
  <div class="section" id="forms"></div>

  <!-- Testimonials Section -->
  <div class="section testimonials" id="testimonials"></div>

</div>

<div id="popupForm">
  <button id="popupClose">&times;</button>
  <h3>Wait! Don’t Miss Your Free Guide!</h3>
  <form class="optInOdoo" data-form-name="Popup Form">
    <input type="email" name="email" placeholder="Your email" required />
    <input type="text" name="name" placeholder="First name (optional)" />
    <button type="submit">Sign Up Now</button>
    <div class="msgOdoo"></div>
  </form>
</div>

<footer>
  <p>&copy; 2025 SharpMind Guides. All Rights Reserved.</p>
  <p><a href="#">Privacy Policy</a> | <a href="#">Contact</a></p>
</footer>

<script>
/* Configuration */
const AFFILIATE_URL = 'https://6c63eby7so29wk6y11m6vk-m6h.hop.clickbank.net';
const ODOO_URL = 'https://sharpmindguidescom.odoo.com';
const API_KEY = '74a3b8f5ea170a909ee67094d08c33864bea0e6c';
const LIST_ID = '2';

/* Data */
const featuresData = [
  { img:'https://img.icons8.com/fluency/96/brain.png', title:'Boost Mental Clarity', text:'Learn practical tips and exercises to sharpen your mind and memory.' },
  { img:'https://img.icons8.com/fluency/96/hearing.png', title:'Enhance Hearing Health', text:'Discover strategies to protect and improve your hearing over time.' },
  { img:'https://img.icons8.com/fluency/96/reading.png', title:'Free Expert Guide', text:'Receive actionable advice curated by health and wellness experts.' }
];

const formsData = [
  { name:'Main Landing Form', id:'mainForm', title:'Get Your Free Guide' },
  { name:'Blog Post 1', title:'Blog Post 1 Signup' },
  { name:'Blog Post 2', title:'Blog Post 2 Signup' },
  { name:'Blog Post 3', title:'Blog Post 3 Signup' },
  { name:'Blog Post 4', title:'Blog Post 4 Signup' },
  { name:'Blog Post 5', title:'Blog Post 5 Signup' }
];

const testimonialsData = [
  { text:'This guide completely changed how I approach my brain health — simple, practical, and effective!', author:'Sarah M.' },
  { text:'I noticed a difference in my hearing awareness in just a few weeks. Highly recommend!', author:'John D.' }
];

/* Render Features */
const featuresContainer = document.getElementById('features');
featuresData.forEach(f=>{
  const div=document.createElement('div');
  div.className='feature';
  div.innerHTML=`<img src="${f.img}" alt="${f.title}"><h3>${f.title}</h3><p>${f.text}</p>`;
  featuresContainer.appendChild(div);
});

/* Render Forms */
const formsContainer = document.getElementById('forms');
formsData.forEach(f=>{
  const div=document.createElement('div');
  div.className='form-container';
  if(f.id) div.id=f.id;
  div.innerHTML=`<h2>${f.title}</h2>
    <form class="optInOdoo" data-form-name="${f.name}">
      <input type="email" name="email" placeholder="Your email" required />
      <input type="text" name="name" placeholder="First name (optional)" />
      <button type="submit">Sign Up</button>
      <div class="msgOdoo"></div>
    </form>`;
  formsContainer.appendChild(div);
});

/* Render Testimonials */
const testimonialsContainer=document.getElementById('testimonials');
testimonialsData.forEach(t=>{
  const div=document.createElement('div');
  div.className='testimonial';
  div.innerHTML=`<p>"${t.text}"</p><h4>- ${t.author}</h4>`;
  testimonialsContainer.appendChild(div);
});

/* Scroll helper */
function scrollToSection(id){document.getElementById(id).scrollIntoView({behavior:'smooth'});}

/* Form handling */
function setupOdooForm(form){
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const email=form.email.value.trim();
    const name=form.name.value.trim();
    const msgDiv=form.querySelector('.msgOdoo');
    const formName=form.dataset.formName;
    fetch(`${ODOO_URL}/api/email_marketing_subscribe`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${API_KEY}`},
      body:JSON.stringify({email,name,list_id:LIST_ID})
    }).then(res=>{
      if(res.ok){msgDiv.textContent='Thanks! Redirecting you now...';console.log(`Conversion from form: ${formName}, Email: ${email}`); setTimeout(()=>window.location.href=AFFILIATE_URL,900);}
      else msgDiv.textContent='Error submitting email. Try again.';
    }).catch(err=>{msgDiv.textContent='Error submitting email. Try again.';});
  });
}
document.querySelectorAll('.optInOdoo').forEach(f=>setupOdooForm(f));

/* Popup logic */
const popup=document.getElementById('popupForm');
const popupClose=document.getElementById('popupClose');
setTimeout(()=>{popup.style.display='block';},5000);
document.addEventListener('mouseout', e=>{if(!popup.dataset.shown && e.clientY<5){popup.style.display='block'; popup.dataset.shown=true;}});
popupClose.addEventListener('click',()=>{popup.style.display='none';});

/* Intersection Observer for animations */
const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
    }
  });
},{threshold:0.15});
document.querySelectorAll('.form-container, .feature, .testimonial').forEach(el=>observer.observe(el));
</script>

</body>
</html>
